services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-pedidos360}
      MARIADB_USER: ${DB_USERNAME:?Define DB_USERNAME en .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pedidos360-network

  # -------------------------------------------------------------
  # FRONTEND ANGULAR (Servido por Nginx en puerto 80 en la EC2)
  # -------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: frontend-pedidos360
    restart: always
    ports:
      - "80:80"
    networks:
      - pedidos360-network

  # -------------------------------------------------------------
  # BROKER DE MENSAJERÍA ASÍNCRONA: RabbitMQ con Management UI
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-pedidos360
    restart: always
    ports:
      - "5672:5672"    # Puerto AMQP para comunicación con Spring Boot
      - "15672:15672"  # Consola Web de Administración
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Define RABBIT_PASSWORD en .env}
    networks:
      - pedidos360-network

  # -------------------------------------------------------------
  # MICROSERVICIOS BASE
  # -------------------------------------------------------------
  catalogo-api:
    build: ./backend/catalogo-api
    container_name: catalogo-api
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBIT_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBIT_PASSWORD:?Define RABBIT_PASSWORD en .env}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mariadb:3306/${DB_NAME:-pedidos360}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Define DB_USERNAME en .env}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    depends_on:
      - rabbitmq
      - mariadb
    networks:
      - pedidos360-network

  carrito-api:
    build: ./backend/carrito-api
    container_name: carrito-api
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mariadb:3306/${DB_NAME:-pedidos360}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Define DB_USERNAME en .env}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    depends_on:
      - mariadb
    networks:
      - pedidos360-network

  auth-api:
    build: ./backend/auth-api
    container_name: auth-api
    restart: always
    ports:
      - "8083:8083"
    networks:
      - pedidos360-network

  # -------------------------------------------------------------
  # NUEVOS MICROSERVICIOS DEL ENCARGO
  # -------------------------------------------------------------
  orders-service:
    build: ./backend/orders-service
    container_name: orders-service
    restart: always
    ports:
      - "8084:8084"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBIT_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBIT_PASSWORD:?Define RABBIT_PASSWORD en .env}
    depends_on:
      - rabbitmq
    networks:
      - pedidos360-network

  notifications-service:
    build: ./backend/notifications-service
    container_name: notifications-service
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBIT_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBIT_PASSWORD:?Define RABBIT_PASSWORD en .env}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      - rabbitmq
    networks:
      - pedidos360-network

  envios-service:
    build: ./backend/envios-service
    container_name: envios-service
    restart: always
    ports:
      - "8086:8086"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBIT_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBIT_PASSWORD:?Define RABBIT_PASSWORD en .env}
    depends_on:
      - rabbitmq
    networks:
      - pedidos360-network

networks:
  pedidos360-network:
    driver: bridge

volumes:
  mariadb-data:
