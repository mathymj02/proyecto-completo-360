# Configuración de la EC2 original para servir Angular por HTTPS directo y
# por la HTTP API de AWS. El gateway termina HTTPS y envía HTTP al puerto 80.
# API Gateway añade "Forwarded: ...;proto=https" al enviar la solicitud.
# Esta cabecera distingue el recorrido, pero NO es una autenticación: el
# puerto 80 sigue siendo público y un cliente puede enviar esa cabecera.
server {
    listen 80;
    server_name localhost;

    if ($http_forwarded !~* "proto=https") {
        return 301 https://$host$request_uri;
    }

    # La ruta $default de API Gateway también reenvía el preflight de las
    # rutas API. API Gateway añade las cabeceras CORS a esta respuesta 204.
    if ($request_method = OPTIONS) {
        return 204;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # La HTTP API reenvía estas rutas REST por $default. El servicio vuelve
    # a validar el JWT para las recomendaciones personalizadas.
    location /api/v1/analytics/ {
        proxy_pass http://172.31.42.125:8088;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # La ruta $default del Gateway llega aquí; ms-pago valida el JWT.
    location /api/v1/payments {
        proxy_pass http://172.31.42.125:8087;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /ws/metrics {
        proxy_pass http://172.31.42.125:8088/ws/metrics;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

server {
    listen 443 ssl;
    server_name localhost;

    # El certificado y la clave permanecen dentro de la imagen existente.
    # El archivo nginx.key nunca se publica en GitHub.
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El navegador usa este HTTPS directo para el WebSocket, incluso si
    # Angular se abrió desde la URL HTTPS de API Gateway.
    location /ws/metrics {
        proxy_pass http://172.31.42.125:8088/ws/metrics;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    location /api/v1/analytics/ {
        proxy_pass http://172.31.42.125:8088;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/payments {
        proxy_pass http://172.31.42.125:8087;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
