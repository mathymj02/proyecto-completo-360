server {
    # listen 80: Nginx escucha en el puerto HTTP estándar
    listen 80;
    
    # server_name localhost: Acepta cualquier solicitud que llegue a la máquina
    server_name localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $analytics_backend analytics-recommendations:8088;

    # root: Ruta del disco del contenedor donde copiamos los archivos de Angular
    root /usr/share/nginx/html;
    
    # index: El archivo inicial que debe cargar el navegador
    index index.html;

    location / {
        # try_files: Intenta buscar el archivo solicitado; si no existe, entrega index.html
        # Esto es FUNDAMENTAL para que rutas como /dashboard o /login no den 404 al recargar
        try_files $uri $uri/ /index.html;
    }

    # WebSocket de métricas: Nginx mantiene el Upgrade y conecta al servicio
    # de analítica dentro de la red de Docker. En EC2 se replica este bloque
    # también en el server HTTPS local que no está versionado.
    location /ws/metrics {
        proxy_pass http://$analytics_backend/ws/metrics;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    location /api/v1/analytics/ {
        proxy_pass http://$analytics_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Habilitar compresión Gzip para que la página cargue ultra rápido en la nube
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
