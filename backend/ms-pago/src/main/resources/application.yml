server:
  port: 8087

spring:
  application:
    name: ms-pago
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

azure:
  tenant-id: ${AZURE_TENANT_ID:e5372bf0-c5e3-4286-887c-79069f209c1f}
  client-id: ${AZURE_CLIENT_ID:0d5904de-0d7a-474d-ba0a-d8a8ea6d14f8}

payments:
  card-hash-salt: ${CARD_HASH_SALT}
  frontend-base-url: ${FRONTEND_BASE_URL}
  webpay:
    base-url: ${WEBPAY_BASE_URL:https://webpay3gint.transbank.cl}
    commerce-code: ${WEBPAY_COMMERCE_CODE}
    api-key: ${WEBPAY_API_KEY}
