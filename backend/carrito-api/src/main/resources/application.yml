server:
  port: 8082

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  application:
    name: carrito-api
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

analytics:
  kafka:
    enabled: ${ANALYTICS_KAFKA_ENABLED:false}

azure:
  tenant-id: e5372bf0-c5e3-4286-887c-79069f209c1f
  client-id: 0d5904de-0d7a-474d-ba0a-d8a8ea6d14f8
  expected-audience: 0d5904de-0d7a-474d-ba0a-d8a8ea6d14f8
  issuer-v2: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0

cors:
  allowed-origins: http://localhost:5173,http://localhost:4200,https://main.diml48c4gyhqd.amplifyapp.com,https://z97t6a0hfj.execute-api.us-east-1.amazonaws.com

