server:
  port: 8085

spring:
  application:
    name: notifications-service

  # RabbitMQ
  rabbitmq:
    host: 
    port: 
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

  # Configuración SMTP Gmail (Guía Duoc UC)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
