server:
  port: 8088

spring:
  application:
    name: analytics-recommendations
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: analytics-recommendations
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

analytics:
  dynamodb:
    enabled: ${DYNAMODB_ENABLED:false}
    table: ${DYNAMODB_TABLE:Pedidos360Events}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4200}

azure:
  tenant-id: ${AZURE_TENANT_ID:e5372bf0-c5e3-4286-887c-79069f209c1f}
  client-id: ${AZURE_CLIENT_ID:0d5904de-0d7a-474d-ba0a-d8a8ea6d14f8}
