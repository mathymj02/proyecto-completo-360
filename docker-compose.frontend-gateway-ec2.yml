# Aplicar sobre docker-compose.live-ec2.yml en la EC2 original.
# Monta solo la configuración Nginx; conserva imagen, Angular y certificados.
services:
  frontend:
    volumes:
      - ./frontend/nginx.gateway.conf:/etc/nginx/conf.d/default.conf:ro
      # La clave privada permanece solo en el checkout anterior de la EC2.
      - /home/ec2-user/proyecto-completo/frontend/ssl:/etc/nginx/ssl:ro
